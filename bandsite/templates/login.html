{% extends "base.html" %}
{% block title %}Sign in · {{ band.name }}{% endblock %}
{% block body %}
<main class="sheet">
  <h1>Sign in</h1>
  {% include "_flashes.html" %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="field choices">
      <label><input type="checkbox" name="remember" value="1"><span>Keep me signed in</span></label>
    </div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p class="below">No account yet? <a href="{{ url_for('auth.register') }}">Register as a band member</a></p>
  <p class="below"><a href="{{ url_for('main.landing') }}">Back to the home page</a></p>
</main>
{% endblock %}
