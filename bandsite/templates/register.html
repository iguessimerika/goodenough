{% extends "base.html" %}
{% block title %}Register · {{ band.name }}{% endblock %}
{% block body %}
<main class="sheet">
  <h1>Register</h1>
  {% include "_flashes.html" %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="band_code">Band word</label>
      <input id="band_code" name="band_code" type="password" autocomplete="off" required>
      <p class="hint">You get the band word from your band. Without it, nobody can register.</p>
    </div>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" maxlength="80" autocomplete="name" value="{{ v.name }}" required>
    </div>
    <div class="field">
      <label for="instrument">Instrument (optional)</label>
      <input id="instrument" name="instrument" type="text" maxlength="80" value="{{ v.instrument }}">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" value="{{ v.email }}" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      <p class="hint">At least 8 characters.</p>
    </div>
    <div class="field">
      <label for="password2">Repeat password</label>
      <input id="password2" name="password2" type="password" minlength="8" autocomplete="new-password" required>
    </div>
    <button class="btn primary" type="submit">Create account</button>
  </form>
  <p class="below">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</main>
{% endblock %}
